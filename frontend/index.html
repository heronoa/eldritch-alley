<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eldritch Alley: Tactics</title>
    <style>
      /* Both typefaces are served from this origin, so a match never waits on a third party and
         the page still renders — in the fallback monospace — with the network off. */
      @font-face {
        font-family: 'Special Elite';
        src: url('/fonts/SpecialElite-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/IBMPlexMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/IBMPlexMono-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }

      /* The title is a page, not a canvas: the night it sits on belongs to the document. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070f;
      }
    </style>
    <link rel="stylesheet" href="/src/title/title.css" />
  </head>
  <body>
    <canvas id="title-city" aria-hidden="true"></canvas>
    <div class="shade"></div>
    <main class="title">
      <div>
        <p class="meta">SECRETARIA DE ASSUNTOS OCULTOS · OCORRÊNCIA Nº 2026/0001</p>
        <h1>Eldritch Alley</h1>
        <span class="stamp">TACTICS</span>
        <p class="tagline">Agentes licenciados, magia sem licença e uma cidade inteira de becos. Monte o seu esquadrão e responda à ocorrência.</p>
        <button class="cta" id="cta" type="button">Iniciar partida</button>
        <p class="hint">ou pressione Enter</p>
        <p class="alert" id="alert" role="status"></p>
      </div>
    </main>
    <div class="granted" id="granted" aria-live="polite">PARTIDA AUTORIZADA</div>
    <footer><span>v0.1</span><span>Belém · madrugada</span></footer>
    <div id="game" hidden></div>
    <script type="module" src="/src/title/title.ts"></script>
  </body>
</html>
