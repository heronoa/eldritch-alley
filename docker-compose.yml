# Local environment: infrastructure + the two backend services.
#   npm run infra:up            Postgres, Redis and LocalStack only
#   docker compose up --build   everything, including game-server and platform-api

name: eldritch-alley

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eldritch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eldritch}
      POSTGRES_DB: ${POSTGRES_DB:-eldritch_alley}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eldritch} -d ${POSTGRES_DB:-eldritch_alley}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

  # The schema, applied once, before any instance of the API starts. It is the same image with a
  # different command: the migration is a process, not something the API does on its way up.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: platform-api
    image: eldritch-alley/platform-api:local
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-eldritch}:${POSTGRES_PASSWORD:-eldritch}@postgres:5432/${POSTGRES_DB:-eldritch_alley}
    depends_on:
      postgres:
        condition: service_healthy

  platform-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: platform-api
    image: eldritch-alley/platform-api:local
    environment:
      PLATFORM_API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-eldritch}:${POSTGRES_PASSWORD:-eldritch}@postgres:5432/${POSTGRES_DB:-eldritch_alley}
      REDIS_URL: redis://redis:6379
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Completed successfully, not merely started: the API assumes the schema is already there.
      migrate:
        condition: service_completed_successfully

  game-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: game-server
    image: eldritch-alley/game-server:local
    environment:
      GAME_SERVER_PORT: 2567
      REDIS_URL: redis://redis:6379
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    ports:
      - "2567:2567"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  localstack-data:
