# Ambiente local: infraestrutura + os dois serviços do backend.
#   npm run infra:up            só Postgres, Redis e LocalStack
#   docker compose up --build   tudo, incluindo game-server e platform-api

name: mystic-alley

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mystic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mystic}
      POSTGRES_DB: ${POSTGRES_DB:-mystic_alley}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mystic} -d ${POSTGRES_DB:-mystic_alley}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

  platform-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: platform-api
    image: mystic-alley/platform-api:local
    environment:
      PLATFORM_API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-mystic}:${POSTGRES_PASSWORD:-mystic}@postgres:5432/${POSTGRES_DB:-mystic_alley}
      REDIS_URL: redis://redis:6379
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  game-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: game-server
    image: mystic-alley/game-server:local
    environment:
      GAME_SERVER_PORT: 2567
      REDIS_URL: redis://redis:6379
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
    ports:
      - "2567:2567"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  localstack-data:
